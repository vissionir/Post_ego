name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:
    inputs:
      ai_snapshot_run:
        description: "Keep the AI layer unchanged by restoring github-pages from this run"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Let an active Pages sync finish before starting the next release.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        # Fail before publishing if an atom loses its stable origin date.
        # Definitions and modification dates remain independent of this chronology.
        run: |
          node scripts/atom-chronology.mjs --check
          node scripts/check-chinese-corpus.mjs
          npx quartz build
          npx tsx scripts/check-public-routes.ts

      - name: Build AI context
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ai_snapshot_run == '' }}
        run: npm run build:ai

      - name: Download unchanged AI snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_snapshot_run != '' }}
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/postego-ai-snapshot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ai_snapshot_run }}

      - name: Restore unchanged AI snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_snapshot_run != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/postego-ai-extract"
          tar -xf "$RUNNER_TEMP/postego-ai-snapshot/artifact.tar" -C "$RUNNER_TEMP/postego-ai-extract" ./ai
          test -f "$RUNNER_TEMP/postego-ai-extract/ai/manifest.json"
          test ! -e public/ai
          cp -a "$RUNNER_TEMP/postego-ai-extract/ai" public/ai

      - name: Record deployed revision
        run: printf '%s\n' "$GITHUB_SHA" > public/deployment-version.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        continue-on-error: true

      - name: Retry Pages deploy with the same artifact
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5.0.1

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 4
    steps:
      - name: Verify the revision on post-ego.com
        run: |
          for attempt in {1..12}; do
            url="https://post-ego.com/deployment-version.txt?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if revision="$(curl --fail --silent --show-error --max-time 8 "$url")" && [[ "$revision" == "$GITHUB_SHA" ]]; then
              echo "Verified $GITHUB_SHA on post-ego.com."
              exit 0
            fi
            if [[ "$attempt" != 12 ]]; then sleep 5; fi
          done
          echo "::error::post-ego.com did not serve the expected revision $GITHUB_SHA"
          exit 1

name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:
    inputs:
      ai_snapshot_run:
        description: "Keep the AI layer unchanged by restoring github-pages from this run"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build site
        # Fail before publishing if an atom loses its stable origin date.
        # Definitions and modification dates remain independent of this chronology.
        run: |
          node scripts/atom-chronology.mjs --check
          node scripts/check-chinese-corpus.mjs
          npx quartz build
          npx tsx scripts/check-public-routes.ts

      - name: Build AI context
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ai_snapshot_run == '' }}
        run: npm run build:ai

      - name: Download unchanged AI snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_snapshot_run != '' }}
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/postego-ai-snapshot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ai_snapshot_run }}

      - name: Restore unchanged AI snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_snapshot_run != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/postego-ai-extract"
          tar -xf "$RUNNER_TEMP/postego-ai-snapshot/artifact.tar" -C "$RUNNER_TEMP/postego-ai-extract" ./ai
          test -f "$RUNNER_TEMP/postego-ai-extract/ai/manifest.json"
          test ! -e public/ai
          cp -a "$RUNNER_TEMP/postego-ai-extract/ai" public/ai

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
